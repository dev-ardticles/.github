name: Update streak statson:  schedule:    - cron: "0 3 * * *" # Run every day at 03:00  push:    paths:      - ".github/workflows/streak-stats.yml" # Run any time this file is modified  workflow_dispatch: # Run manually from the Actions tabjobs:  build:    runs-on: ubuntu-latest    permissions:      contents: write    steps:      - uses: actions/checkout@v7      - name: Generate streak stats        uses: DenverCoder1/github-readme-streak-stats@v1        with:          options: user=${{ github.repository_owner }}&theme=vision-friendly-dark&disable_animations=true&border_radius=5&date_format=j%20M%5B%20Y%5D          path: profile/streak.svg      - name: Commit streak stats        run: |          git config user.name "github-actions[bot]"          git config user.email "github-actions[bot]@users.noreply.github.com"          git add profile/streak.svg          git commit -m "Update streak stats" || exit 0          git push
